name: 14 - working with artifacts

on:
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 14-artifacts/react-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v3
        with:
            node-version: '24.x'

      - name: Download cached dependancies
        uses: actions/cache@v4
        id: cache
        with:
            path: 14-artifacts/react-app/node_modules
            key: deps-node-modules-${{hashFiles('14-artifacts/react-app/package-lock.json')}}
    
      - name: Install Dependancies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
    
      - name: Unit tests
        run: npm run test
    
      - name: Build code
        run: npm run build
    
      - name: upload build files
        uses: actions/upload-artifact@v7
        with:
            name: app
            path: 14-artifacts/react-app/build

  deploy:
    runs-on: ubuntu-latest
    needs:
      - test-build
    steps:
      - name: Download build files
        uses: actions/download-artifact@v8
        with:
            name: app
            path: build

      - name: Show folder struccture
        run: ls -R
