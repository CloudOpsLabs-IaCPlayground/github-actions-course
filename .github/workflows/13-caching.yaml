name: 13 - Using Caching

on: 
    workflow_dispatch:
        inputs:
            use-cache:
                type: boolean
                default: true
                description: Whether to execute cache step
            
            node-version:
                type: choice
                options:
                    - 18.x
                    - 20.x
                    - 21.x
                default: 20.x
jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: 13-caching/react-app
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v3
              with:
                node-version: ${{inputs.node-version}}

            - name: Download cached dependancies
              uses: actions/cache@v3
              if: ${{inputs.use-cache}}
              id: cache
              with:
                  path: 13-caching/recat-app/package-lock.json
                  key: deps-node-modules-${{hashFiles('13-caching/recat-app/package-lock.json')}}

            - name: Install Dependancies
              if: steps.cache.outputs.cache-hit != 'true'
              run: npm ci
            
            - name: Testing
              run: npm run test

            - name: Building
              run: npm run build

            - name: Deploying to nonprod
              run: echo "Deploying to nonprod"


        # 1. checkout the code
        # 2. Install Dependancies
        # 3. Unit testing and building
        # 4. Deploy to a nonprod environment

    install-deps:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: 13-caching/react-app
        outputs:
            deps-cache-key: ${{steps.cache-key.outputs.CACHE_KEY}}
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v3
              with:
                node-version: ${{inputs.node-version}}

            - name: Calculate cache key
              id: cache-key
              run: |
                echo: "CACHE_KEY=deps-node-modules-${{hashFiles('13-caching/recat-app/package-lock.json')}}" >> "GITHUB_OUTPUT"  

            - name: Download cached dependancies
              uses: actions/cache@v3
              if: ${{inputs.use-cache}}
              id: cache
              with:
                  path: 13-caching/recat-app/package-lock.json
                  key: ${{steps.cache-key.outputs.CACHE_KEY}}

            - name: Install Dependancies
              if: steps.cache.outputs.cache-hit != 'true'
              run: npm ci
            
            - name: Testing
              run: npm run test

            - name: Building
              run: npm run build

            - name: Deploying to nonprod
              run: echo "Deploying to nonprod"
